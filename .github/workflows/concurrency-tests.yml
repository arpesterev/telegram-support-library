name: Concurrency regression tests

on:
  push:
    branches:
      - 'fix/concurrent-update-processing-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Gradle handling tests
        run: gradle :handling:test --no-daemon
